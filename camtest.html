<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F3EF">
<title>카메라 시험 · 영수증 스캔</title>
<style>
:root{--bg:#F4F3EF;--ink:#16171A;--sub:#5E626A;--line:#ECEAE4;--accent:#2F4FD8}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 32px)}
.top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.top a{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none;font-size:22px}
h1{font-size:20px;margin:0}
p.lead{color:var(--sub);font-size:14px;line-height:1.6;margin:4px 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
.row{display:flex;gap:8px}
.btn{flex:1;height:52px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
.btn.alt{background:#fff;color:var(--ink);border:1px solid #DADCE0}
.btn:disabled{opacity:.5}
input[type=file]{display:none}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--sub);width:42%}
.ok{color:#0F7B3F;font-weight:600}.warn{color:#A11D1D;font-weight:600}
#preview{display:block;max-width:100%;max-height:280px;margin:10px auto 0;border-radius:10px;border:1px solid var(--line)}
.note{font-size:12px;color:var(--sub);line-height:1.5;margin-top:8px}
</style>
</head>
<body>
<main>
  <div class="top"><a href="./#/home" aria-label="홈으로">‹</a><h1>카메라 시험</h1></div>
  <p class="lead">3단계(촬영)를 만들기 전에 이 폰에서 카메라와 사진이 어떻게 넘어오는지 확인하는 화면입니다. 결과는 맨 아래 [결과 복사]로 채팅에 붙여 넣어 주세요.</p>

  <div class="card">
    <h2>1. 사진 넣기</h2>
    <div class="row">
      <label class="btn" for="cam">카메라로 찍기</label>
      <label class="btn alt" for="lib">앨범에서 고르기</label>
    </div>
    <input id="cam" type="file" accept="image/*" capture="environment">
    <input id="lib" type="file" accept="image/*">
    <img id="preview" alt="" hidden>
    <table id="photoTable"></table>
    <p class="note">영수증을 <b>세로로 세워서 한 번</b>, <b>폰을 옆으로 눕혀서 한 번</b> 찍어 주세요. 사진 방향이 제대로 인식되는지 봅니다.</p>
  </div>

  <div class="card">
    <h2>2. OpenCV(모서리 찾기 도구) 첫 로딩 시간</h2>
    <button class="btn" id="cvBtn" type="button">OpenCV 불러오기 시험</button>
    <table id="cvTable"></table>
    <p class="note">파일이 커서(약 10MB대) 처음 한 번은 오래 걸릴 수 있습니다. 가능하면 와이파이가 아닌 <b>LTE/5G에서도 한 번</b> 해 봐 주세요.</p>
  </div>

  <div class="card">
    <h2>3. 기기 정보</h2>
    <table id="envTable"></table>
  </div>

  <button class="btn" id="copyBtn" type="button">결과 복사</button>
  <p class="note" id="copyMsg"></p>
</main>

<script>
(function () {
  'use strict';
  var results = { env: {}, photos: [], cv: null };
  var CV_URL = 'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.12.0-release.1/dist/opencv.js';

  function fmtBytes(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.round(n / 1024) + 'KB'; }
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function fill(id, rows) {
    document.getElementById(id).innerHTML = rows.map(function (r) {
      return '<tr><td>' + esc(r[0]) + '</td><td' + (r[2] ? ' class="' + r[2] + '"' : '') + '>' + esc(r[1]) + '</td></tr>';
    }).join('');
  }

  // ── 기기 정보 ──
  var standalone = (window.navigator.standalone === true) || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  results.env = {
    '홈 화면 앱으로 실행': standalone ? '예' : '아니오(브라우저)',
    '화면 크기': screen.width + '×' + screen.height + ' (배율 ' + devicePixelRatio + ')',
    '브라우저 정보': navigator.userAgent
  };
  fill('envTable', Object.keys(results.env).map(function (k) {
    return [k, results.env[k], k === '홈 화면 앱으로 실행' ? (standalone ? 'ok' : 'warn') : ''];
  }));

  // ── JPEG 안의 EXIF 방향값 읽기(1=정상, 6=시계방향 90°, 3=180°, 8=반시계 90°) ──
  function exifOrientation(buf) {
    var v = new DataView(buf);
    if (v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return '없음(JPEG 아님)';
    var off = 2;
    while (off + 4 < v.byteLength) {
      var marker = v.getUint16(off);
      var len = v.getUint16(off + 2);
      if (marker === 0xFFE1 && v.getUint32(off + 4) === 0x45786966) {
        var t = off + 10, little = v.getUint16(t) === 0x4949;
        var ifd = t + v.getUint32(t + 4, little), n = v.getUint16(ifd, little);
        for (var i = 0; i < n; i++) {
          var e = ifd + 2 + i * 12;
          if (v.getUint16(e, little) === 0x0112) return String(v.getUint16(e + 8, little));
        }
        return '없음';
      }
      if ((marker & 0xFF00) !== 0xFF00) break;
      off += 2 + len;
    }
    return '없음';
  }

  async function onFile(ev, source) {
    var f = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!f) return;
    var t0 = performance.now();
    var info = { 방법: source, 파일이름: f.name, 형식: f.type || '(알 수 없음)', 크기: fmtBytes(f.size) };
    try {
      var head = await f.slice(0, 256 * 1024).arrayBuffer();
      info['EXIF 방향값'] = exifOrientation(head);
    } catch (e) { info['EXIF 방향값'] = '읽기 실패'; }
    try {
      var bmp = await createImageBitmap(f);
      info['화면에 보이는 크기'] = bmp.width + '×' + bmp.height + (bmp.width > bmp.height ? ' (가로로 김)' : ' (세로로 김)');
      info['사진 여는 데 걸린 시간'] = Math.round(performance.now() - t0) + 'ms';
      // AI에 보낼 크기(긴 변 1300px)로 줄여 JPEG로 만드는 시간과 크기
      var t1 = performance.now();
      var scale = Math.min(1, 1300 / Math.max(bmp.width, bmp.height));
      var c = document.createElement('canvas');
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      var blob = await new Promise(function (r) { c.toBlob(r, 'image/jpeg', 0.85); });
      info['1300px JPEG 변환'] = c.width + '×' + c.height + ', ' + fmtBytes(blob.size) + ', ' + Math.round(performance.now() - t1) + 'ms';
      var img = document.getElementById('preview');
      img.src = URL.createObjectURL(blob); img.hidden = false;
    } catch (e) {
      info['사진 열기'] = '실패: ' + (e && e.message || e);
    }
    results.photos.push(info);
    fill('photoTable', Object.keys(info).map(function (k) {
      var cls = '';
      if (k === '형식') cls = /heic|heif/i.test(info[k]) ? 'warn' : 'ok';
      return [k, info[k], cls];
    }));
  }
  document.getElementById('cam').addEventListener('change', function (e) { onFile(e, '카메라'); });
  document.getElementById('lib').addEventListener('change', function (e) { onFile(e, '앨범'); });

  // ── OpenCV 로딩 시간 ──
  document.getElementById('cvBtn').addEventListener('click', function () {
    var btn = this; btn.disabled = true; btn.textContent = '불러오는 중…';
    var t0 = performance.now(), tScript;
    var s = document.createElement('script');
    s.src = CV_URL; s.async = true;
    s.onload = async function () {
      tScript = performance.now();
      try {
        var cvObj = window.cv;
        if (cvObj && typeof cvObj.then === 'function') cvObj = await cvObj;
        if (!(cvObj && cvObj.Mat)) {
          await new Promise(function (res, rej) {
            var to = setTimeout(function () { rej(new Error('60초 안에 준비되지 않음')); }, 60000);
            cvObj.onRuntimeInitialized = function () { clearTimeout(to); res(); };
          });
        }
        var tReady = performance.now();
        var entry = performance.getEntriesByName(CV_URL)[0];
        var m = new cvObj.Mat(10, 10, cvObj.CV_8UC1); m.delete();
        results.cv = {
          '다운로드': Math.round(tScript - t0) + 'ms',
          '준비 완료까지(전체)': Math.round(tReady - t0) + 'ms',
          '받은 용량': entry && entry.transferSize ? fmtBytes(entry.transferSize) : '(측정 불가)',
          '동작 확인': '정상'
        };
        fill('cvTable', Object.keys(results.cv).map(function (k) { return [k, results.cv[k], k === '동작 확인' ? 'ok' : '']; }));
        btn.textContent = '완료';
      } catch (e) {
        results.cv = { '결과': '실패: ' + (e && e.message || e) };
        fill('cvTable', [['결과', results.cv['결과'], 'warn']]);
        btn.textContent = '실패';
      }
    };
    s.onerror = function () {
      results.cv = { '결과': '파일을 받지 못함' };
      fill('cvTable', [['결과', '파일을 받지 못함', 'warn']]);
      btn.textContent = '실패';
    };
    document.head.appendChild(s);
  });

  // ── 결과 복사 ──
  document.getElementById('copyBtn').addEventListener('click', async function () {
    var lines = ['[카메라 시험 결과]'];
    Object.keys(results.env).forEach(function (k) { lines.push(k + ': ' + results.env[k]); });
    results.photos.forEach(function (p, i) {
      lines.push('--- 사진 ' + (i + 1));
      Object.keys(p).forEach(function (k) { lines.push(k + ': ' + p[k]); });
    });
    lines.push('--- OpenCV');
    if (results.cv) Object.keys(results.cv).forEach(function (k) { lines.push(k + ': ' + results.cv[k]); });
    else lines.push('시험 안 함');
    var text = lines.join('\n');
    try { await navigator.clipboard.writeText(text); document.getElementById('copyMsg').textContent = '복사했습니다. 채팅에 붙여 넣어 주세요.'; }
    catch (e) { document.getElementById('copyMsg').textContent = '복사가 안 되면 이 화면을 캡처해 주세요.'; }
  });
})();
</script>
</body>
</html>
